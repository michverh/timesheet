# Local infrastructure, started automatically by Spring Boot when running the application.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: timesheet
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet
    ports:
      - "5432"
    volumes:
      # Keeps the timesheets when the container is recreated.
      - postgres-data:/var/lib/postgresql
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web interface: http://localhost:8025
  ollama:
    # Stands in for Ollama with readings recorded from the real model; see wiremock/ollama/README.md.
    image: wiremock/wiremock:3.13.2
    ports:
      - "11435:8080"
    volumes:
      - ./wiremock/ollama:/home/wiremock

volumes:
  postgres-data:
