spring:
  application:
    name: timesheet
  docker:
    compose:
      start:
        # Also start services added to compose.yaml when others are already running.
        skip: never
  web:
    resources:
      chain:
        strategy:
          content:
            # Puts a hash of the content in the URL of stylesheets, so browsers never use an outdated copy.
            enabled: true
            paths: /css/**
  servlet:
    multipart:
      # The client's own timesheet can be at most 10 MB.
      max-file-size: 10MB
      max-request-size: 11MB
  # Locally PostgreSQL from compose.yaml; Flyway owns the schema, Hibernate only checks it.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Loads the days of a timesheet and their hours in a few queries instead of one per day.
        default_batch_fetch_size: 50
  # Mailpit from compose.yaml catches all mail; see http://localhost:8025
  mail:
    host: localhost
    port: 1025

server:
  tomcat:
    # Read oversized uploads to the end, so the browser receives the error instead of a reset connection.
    max-swallow-size: 20MB

timesheet:
  # Reads the hours from clients' timesheets: "ollama" for a local model, "claude" for the Anthropic API.
  client-timesheet-reader:
    transcriber: ollama
    claude:
      model: claude-sonnet-5-5
      # How much the model reasons before answering; "none" for models without this setting, such as claude-haiku-4-5.
      effort: low
      # Left empty, the credentials in the environment are used, such as ANTHROPIC_API_KEY.
      api-key: ${ANTHROPIC_API_KEY:}
    ollama:
      # Locally the stub from compose.yaml, which answers instantly for the examples in wiremock/ollama/examples;
      # http://localhost:11434 reads any document with the model in Ollama itself.
      base-url: http://localhost:11435
      model: qwen3-vl:8b-instruct
  # The professional using the application, until users log in.
  professional:
    email: jan.jansen@openvalue.nl
  # The employment of the professional, until HR maintains it in the application; the holiday leave of the year of
  # joining is in proportion to the days employed.
  employment:
    start-date: 2020-01-01
  assignment:
    # Leave the client empty when on the bench.
    client: Example Client
    project: Example Project
  mail:
    from: timesheets@openvalue.example
    to:
      - hr@openvalue.example
      - finance@openvalue.example
